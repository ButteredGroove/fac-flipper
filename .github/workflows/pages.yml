name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html app.js styles.css site/
          cp favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png site.webmanifest site/
          cp android-chrome-192x192.png android-chrome-512x512.png site/
          cp -R src site/src
          cp -R decks site/decks
          cp -R vendor site/vendor
          cp -R assets site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
