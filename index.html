<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAC Flipper: Fast Action Cards for Statis Pro Baseball</title>
    <meta
      name="description"
      content="FAC Flipper: draw and view Fast Action Cards from configurable decks for Statis Pro Baseball."
    />
    <link rel="canonical" href="https://butteredgroove.github.io/fac-flipper/" />
    <meta property="og:title" content="FAC Flipper: Fast Action Cards for Statis Pro Baseball" />
    <meta
      property="og:description"
      content="FAC Flipper: draw and view Fast Action Cards from configurable decks for Statis Pro Baseball."
    />
    <meta property="og:url" content="https://butteredgroove.github.io/fac-flipper/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://butteredgroove.github.io/fac-flipper/assets/og-fac-flipper.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FAC Flipper logo with a baseball card motif." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FAC Flipper: Fast Action Cards from configurable decks for Statis Pro Baseball" />
    <meta
      name="twitter:description"
      content="FAC Flipper: draw and view Fast Action Cards from configurable decks for Statis Pro Baseball."
    />
    <meta name="twitter:url" content="https://butteredgroove.github.io/fac-flipper/" />
    <meta name="twitter:image" content="https://butteredgroove.github.io/fac-flipper/assets/og-fac-flipper.png" />
    <meta name="twitter:image:alt" content="FAC Flipper logo with a baseball card motif." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-left">
          <div class="deck-display" id="deckDisplay">
            <span class="deck-name" id="deckName">Loading...</span>
            <span class="deck-version" id="deckVersion"></span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn ghost small" id="resetButtonTop" title="Reshuffle and clear history">
            <span class="icon icon-reset" aria-hidden="true"></span>
            Reset
          </button>
          <button class="btn ghost small" id="reshuffleButton" aria-label="Reshuffle (keep history)" title="Reshuffle (keep history)">
            <span class="icon icon-refresh" aria-hidden="true"></span>
            Reshuffle
          </button>
          <button class="btn ghost small" id="aboutButton" type="button">About</button>
        </div>
      </header>

      <div class="content">
        <main class="card-area">
          <div class="card-stage">
            <div class="card-column">
              <div class="card-header">
                <span>CURRENT CARD</span>
                <span class="card-hint-inline">Click card or press Space</span>
              </div>
              <div class="card-frame" id="cardFrame" tabindex="0" role="button" aria-label="Draw card">
                <div class="card" id="card"></div>
              </div>
              <div class="card-actions">
                <button class="btn primary" id="drawButton">Draw</button>
              </div>
            </div>
            <div class="card-column preview-column" id="previewColumn" hidden>
              <div class="card-header">
                <span>SELECTED CARD</span>
                <button class="btn ghost small" id="clearPreview" type="button">Clear</button>
              </div>
              <div class="card-frame preview" id="previewFrame">
                <div class="card" id="previewCard"></div>
              </div>
            </div>
          </div>
        </main>

        <aside class="sidebar">
          <section class="panel">
            <div class="panel-header">Decks</div>
            <ul class="deck-list" id="deckList"></ul>
          </section>

          <section class="panel">
            <div class="toggle-block">
              <label class="switch" aria-label="Toggle without replacement">
                <input type="checkbox" id="replacementToggleSide" />
                <span class="slider"></span>
              </label>
              <div class="toggle-text">
                <div>Without replacement</div>
                <div class="muted" id="remainingText"></div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">History</div>
            <div class="history-list" id="historyList"></div>
          </section>
        </aside>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-title" id="modalTitle">Deck reshuffled</div>
        <div class="modal-body" id="modalBody">Deck expended, reshuffled.</div>
        <div class="modal-actions">
          <button class="btn ghost" id="modalCancel" type="button">Cancel</button>
          <button class="btn primary" id="modalOk" type="button">OK</button>
        </div>
      </div>
    </div>

    <script src="vendor/papaparse.min.js"></script>
    <script type="module" src="app.js"></script>
    <script data-goatcounter="https://butteredgroove.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
